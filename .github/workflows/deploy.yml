# Builds CineVault and deploys to GitHub Pages.
# Repo → Settings → Pages → Source: "GitHub Actions"

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          # So JS/CSS load from https://user.github.io/REPO_NAME/assets/...
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Add this secret in repo Settings → Secrets → Actions
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}

      # Lets React Router work when users refresh on /watchlist etc.
      - name: SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
